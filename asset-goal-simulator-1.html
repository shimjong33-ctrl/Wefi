<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>재산관리 목표 시뮬레이터</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(160deg, #0f172a 0%, #1e293b 60%, #0f172a 100%);
    color: #e2e8f0;
    min-height: 100vh;
    padding: 20px 14px 60px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 22px; }
  header h1 {
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(90deg, #38bdf8, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { font-size: 13px; color: #94a3b8; margin-top: 6px; }

  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 18px 16px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 12px;
    font-weight: 600;
  }
  label {
    display: block;
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 6px;
  }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  input[type="number"] {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 12px 12px;
    font-size: 16px;
    color: #f1f5f9;
    outline: none;
  }
  input[type="number"]:focus { border-color: #38bdf8; }
  .suffix { font-size: 12px; color: #64748b; margin-top: 4px; }

  .goal-editor {
    display: flex;
    gap: 8px;
  }
  .goal-editor input { flex: 1; }
  .goal-editor button {
    background: rgba(56,189,248,0.15);
    border: 1px solid rgba(56,189,248,0.3);
    color: #38bdf8;
    border-radius: 10px;
    padding: 0 14px;
    font-size: 13px;
    font-weight: 600;
  }

  .goal-chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .goal-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 6px 10px 6px 12px;
    font-size: 13px;
  }
  .goal-chip button {
    background: none;
    border: none;
    color: #f87171;
    font-size: 14px;
    line-height: 1;
    padding: 2px 4px;
  }
  .goal-chip .chip-label { cursor: pointer; }
  .goal-chip.selected {
    background: rgba(56,189,248,0.15);
    border-color: rgba(56,189,248,0.4);
  }
  .goal-chip.selected .chip-label { color: #38bdf8; font-weight: 700; }

  .month-sim-box {
    margin-top: 12px;
    background: rgba(56,189,248,0.08);
    border: 1px solid rgba(56,189,248,0.25);
    border-radius: 12px;
    padding: 14px 14px;
  }
  .month-sim-box .title { font-size: 13px; color: #38bdf8; font-weight: 700; margin-bottom: 8px; }
  .month-sim-box .row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; color: #cbd5e1; }
  .month-sim-box .row .val { font-weight: 700; color: #f1f5f9; }
  .month-sim-box .big { font-size: 20px; font-weight: 800; color: #38bdf8; margin-top: 6px; }

  .asset-editor {
    display: flex;
    gap: 8px;
  }
  .asset-editor input:first-child { flex: 1.1; }
  .asset-editor input:nth-child(2) { flex: 1; }
  .asset-editor input[type="text"] {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 12px 12px;
    font-size: 15px;
    color: #f1f5f9;
    outline: none;
  }
  .asset-editor input[type="text"]:focus { border-color: #38bdf8; }
  .asset-editor button {
    background: rgba(56,189,248,0.15);
    border: 1px solid rgba(56,189,248,0.3);
    color: #38bdf8;
    border-radius: 10px;
    padding: 0 14px;
    font-size: 13px;
    font-weight: 600;
  }

  .asset-list { margin-top: 12px; }
  .asset-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 13.5px;
  }
  .asset-row .name { color: #e2e8f0; font-weight: 600; }
  .asset-row .amt { color: #94a3b8; margin-left: 8px; }
  .asset-row .del {
    background: none;
    border: none;
    color: #f87171;
    font-size: 14px;
    padding: 2px 4px;
  }
  .asset-row .edit {
    background: none;
    border: none;
    color: #94a3b8;
    font-size: 14px;
    padding: 2px 4px;
  }
  .asset-row-actions { display: flex; align-items: center; gap: 2px; }
  .asset-row.editing {
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
  }
  .asset-edit-fields {
    display: flex;
    gap: 8px;
  }
  .asset-edit-fields input {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13.5px;
    color: #f1f5f9;
    outline: none;
  }
  .asset-edit-fields input[type="text"] { flex: 1.1; }
  .asset-edit-fields input[type="number"] { flex: 1; }
  .asset-edit-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .asset-edit-actions button {
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight: 600;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05);
    color: #cbd5e1;
  }
  .asset-edit-actions .save-btn {
    background: rgba(56,189,248,0.15);
    border-color: rgba(56,189,248,0.3);
    color: #38bdf8;
  }
  .asset-total-row {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 14px;
  }
  .asset-total-row .label { color: #94a3b8; }
  .asset-total-row .value { color: #38bdf8; font-weight: 800; }

  .timeline { position: relative; padding-left: 22px; }
  .timeline::before {
    content: "";
    position: absolute;
    left: 7px; top: 6px; bottom: 6px;
    width: 2px;
    background: linear-gradient(180deg, #38bdf8, #a78bfa);
    opacity: 0.4;
  }
  .stage {
    position: relative;
    padding-bottom: 22px;
  }
  .stage:last-child { padding-bottom: 0; }
  .stage::before {
    content: "";
    position: absolute;
    left: -22px; top: 3px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #0f172a;
    border: 3px solid #38bdf8;
  }
  .stage.done::before { background: #22c55e; border-color: #22c55e; }
  .stage.stage-preview::before { border-style: dashed; opacity: 0.6; }
  .stage.stage-preview { opacity: 0.65; }
  .stage.stage-preview .stage-goal { font-style: italic; }
  .stage-goal { font-size: 16px; font-weight: 700; color: #f1f5f9; }
  .stage-meta { font-size: 12.5px; color: #94a3b8; margin-top: 3px; line-height: 1.5; }
  .stage-meta .highlight { color: #38bdf8; font-weight: 700; }
  .stage.done .stage-meta .highlight { color: #22c55e; }
  .stage-bar {
    margin-top: 8px;
    height: 6px;
    border-radius: 3px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
  }
  .stage-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #38bdf8, #a78bfa);
    border-radius: 3px;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .summary-row:last-child { border-bottom: none; }
  .summary-row .label { color: #94a3b8; }
  .summary-row .value { font-weight: 700; color: #f1f5f9; }

  .empty-note {
    font-size: 12.5px;
    color: #64748b;
    text-align: center;
    padding: 10px 0;
  }

  footer { text-align: center; margin-top: 20px; font-size: 11px; color: #475569; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>재산관리 목표 시뮬레이터</h1>
    <p>하루 저축액을 기준으로 목표금액 도달 시점을 계산합니다</p>
  </header>

  <div class="card">
    <h2>보유 자산 내역</h2>
    <div class="asset-editor">
      <input type="text" id="assetName" placeholder="자산명 (예: 예금, 주식, 부동산)">
      <input type="number" id="assetAmount" placeholder="금액(만원)" step="1">
      <button id="addAssetBtn">추가</button>
    </div>
    <div class="suffix" style="margin-top:8px;">만원 단위로 입력하세요 (예: 500 → 500만원)</div>
    <div class="asset-list" id="assetList"></div>
    <div class="asset-total-row">
      <span class="label">총 보유 자산</span>
      <span class="value" id="assetTotal">0원</span>
    </div>
  </div>

  <div class="card">
    <h2>저축 조건</h2>
    <div class="field">
      <label for="daily">매일 저축(투자) 금액 (원)</label>
      <input type="number" id="daily" placeholder="예: 20000" step="1000">
      <div class="suffix">하루에 모으는 금액을 입력하세요 (원 단위)</div>
      <div class="suffix" id="monthlyEquiv" style="color:#38bdf8; font-weight:600; margin-top:6px;"></div>
    </div>
    <button id="addDailyBtn" style="width:100%; margin-top:12px; background:rgba(56,189,248,0.15); border:1px solid rgba(56,189,248,0.35); color:#38bdf8; border-radius:10px; padding:12px; font-size:14px; font-weight:700;">오늘 저축 완료 · 목표통장에 추가</button>
    <div class="suffix" id="addDailyMsg" style="text-align:center; margin-top:6px;"></div>
  </div>

  <div class="card">
    <h2>오늘 지출 기록</h2>
    <div class="asset-editor">
      <input type="text" id="expenseName" placeholder="지출 항목 (예: 커피, 점심, 교통비)">
      <input type="number" id="expenseAmount" placeholder="금액(원)" step="1000">
      <button id="addExpenseBtn">추가</button>
    </div>
    <div class="asset-list" id="expenseList"></div>
    <div class="asset-total-row">
      <span class="label">오늘 총 지출</span>
      <span class="value" id="expenseTodayTotal" style="color:#f87171;">0원</span>
    </div>
  </div>

  <div class="card">
    <h2>이번 달 지출 분석</h2>
    <div id="expenseAnalysis"></div>
  </div>

  <div class="card">
    <h2>단계별 목표금액</h2>
    <div class="goal-editor">
      <input type="number" id="newGoal" placeholder="목표금액(만원)" step="1">
      <button id="addGoalBtn">추가</button>
    </div>
    <div class="suffix" style="margin-top:8px;">만원 단위로 입력하세요 (예: 5000 → 5,000만원)</div>
    <div class="goal-chip-row" id="goalChips"></div>
    <div id="monthSimBox"></div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h2 style="margin-bottom:0;">시뮬레이션 결과</h2>
      <button id="clearGoalsBtn" style="background:rgba(248,113,113,0.12); border:1px solid rgba(248,113,113,0.3); color:#f87171; border-radius:8px; padding:5px 10px; font-size:12px; font-weight:600;">전체 삭제</button>
    </div>
    <div id="results"></div>
  </div>

  <footer>입력값은 이 기기에 자동 저장됩니다<br>만든사람: 발란스 J.G SHIM</footer>
</div>

<script>
(function(){
  var STORAGE_KEY = 'assetGoalSimState_v1';

  var assetNameEl = document.getElementById('assetName');
  var assetAmountEl = document.getElementById('assetAmount');
  var addAssetBtn = document.getElementById('addAssetBtn');
  var assetListEl = document.getElementById('assetList');
  var assetTotalEl = document.getElementById('assetTotal');
  var dailyEl = document.getElementById('daily');
  var monthlyEquivEl = document.getElementById('monthlyEquiv');
  var addDailyBtn = document.getElementById('addDailyBtn');
  var addDailyMsg = document.getElementById('addDailyMsg');
  var expenseNameEl = document.getElementById('expenseName');
  var expenseAmountEl = document.getElementById('expenseAmount');
  var addExpenseBtn = document.getElementById('addExpenseBtn');
  var expenseListEl = document.getElementById('expenseList');
  var expenseTodayTotalEl = document.getElementById('expenseTodayTotal');
  var expenseAnalysisEl = document.getElementById('expenseAnalysis');

  function todayStr(){
    var d = new Date();
    var y = d.getFullYear();
    var m = ('0' + (d.getMonth()+1)).slice(-2);
    var day = ('0' + d.getDate()).slice(-2);
    return y + '-' + m + '-' + day;
  }
  var newGoalEl = document.getElementById('newGoal');
  var addGoalBtn = document.getElementById('addGoalBtn');
  var goalChips = document.getElementById('goalChips');
  var clearGoalsBtn = document.getElementById('clearGoalsBtn');
  var monthSimBox = document.getElementById('monthSimBox');
  var results = document.getElementById('results');

  var defaultGoals = [100000000, 500000000, 1000000000, 5000000000]; // 1억, 5억, 10억, 50억

  var state = loadState();
  var editingAssetIndex = null;
  var selectedGoalForSim = null;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}

  function loadState(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.goals && parsed.goals.length) {
          if (!parsed.assets) {
            parsed.assets = parsed.current ? [{ name: '기존 자산', amount: parsed.current }] : [];
          }
          if (parsed.daily === undefined) {
            parsed.daily = parsed.monthly ? Math.round(parsed.monthly / 30) : 16667;
          }
          if (!parsed.expenses) parsed.expenses = [];
          // clean up stray tiny values left over from an older 원 단위 입력 bug
          parsed.goals = parsed.goals.filter(function(g){ return g >= 10000; });
          if (parsed.assets) {
            parsed.assets = parsed.assets.filter(function(a){ return a.amount >= 10000; });
          }
          if (parsed.goals.length === 0) parsed.goals = defaultGoals.slice();
          return parsed;
        }
      }
    } catch(e) {}
    return { assets: [], daily: 16667, goals: defaultGoals.slice(), expenses: [] };
  }

  function saveState(){
    state.daily = parseFloat(dailyEl.value) || 0;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  }

  function getCurrentTotal(){
    var sum = 0;
    (state.assets || []).forEach(function(a){ sum += a.amount; });
    return sum;
  }

  function fmtWon(n){
    n = Math.round(n);
    var isNeg = n < 0;
    n = Math.abs(n);
    if (n < 10000) {
      return (isNeg ? '-' : '') + n.toLocaleString('ko-KR') + '원';
    }
    var eok = Math.floor(n / 100000000);
    var rem = n % 100000000;
    var man = Math.floor(rem / 10000);
    var won = rem % 10000;
    var parts = [];
    if (eok > 0) parts.push(eok.toLocaleString('ko-KR') + '억');
    if (man > 0) parts.push(man.toLocaleString('ko-KR') + '만');
    if (won > 0) parts.push(won.toLocaleString('ko-KR'));
    if (parts.length === 0) parts.push('0만');
    return (isNeg ? '-' : '') + parts.join(' ') + '원';
  }

  function fmtRaw(n){
    return Math.round(n).toLocaleString('ko-KR') + '원';
  }

  function addMonthsToDate(base, months){
    var d = new Date(base.getTime());
    d.setMonth(d.getMonth() + months);
    return d;
  }

  function fmtDate(d){
    return d.getFullYear() + '년 ' + (d.getMonth()+1) + '월';
  }

  function monthsToReach(startAmount, target, monthly){
    if (startAmount >= target) return 0;
    if (monthly <= 0) return null; // never
    return Math.ceil((target - startAmount) / monthly);
  }

  function render(){
    // inputs
    dailyEl.value = state.daily || '';
    var dailyForMonthly = parseFloat(dailyEl.value) || 0;
    if (dailyForMonthly > 0) {
      monthlyEquivEl.textContent = '한 달 약 ' + fmtWon(dailyForMonthly * 30) + ' 저축하는 셈이에요 (한 달 30일 기준)';
    } else {
      monthlyEquivEl.textContent = '';
    }

    // asset list
    assetListEl.innerHTML = '';
    (state.assets || []).forEach(function(a, idx){
      var row = document.createElement('div');

      if (editingAssetIndex === idx) {
        row.className = 'asset-row editing';

        var fields = document.createElement('div');
        fields.className = 'asset-edit-fields';
        var nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.value = a.name;
        var amtInput = document.createElement('input');
        amtInput.type = 'number';
        amtInput.value = a.amount / 10000;
        amtInput.step = '1';
        amtInput.placeholder = '만원';
        fields.appendChild(nameInput);
        fields.appendChild(amtInput);
        row.appendChild(fields);

        var actions = document.createElement('div');
        actions.className = 'asset-edit-actions';
        var cancelBtn = document.createElement('button');
        cancelBtn.textContent = '취소';
        cancelBtn.onclick = function(){
          editingAssetIndex = null;
          render();
        };
        var saveBtn = document.createElement('button');
        saveBtn.className = 'save-btn';
        saveBtn.textContent = '저장';
        saveBtn.onclick = function(){
          var newName = (nameInput.value || '').trim();
          var newAmt = (parseFloat(amtInput.value) || 0) * 10000;
          if (!newName || !newAmt || newAmt <= 0) return;
          state.assets[idx] = { name: newName, amount: newAmt };
          editingAssetIndex = null;
          saveState();
          render();
        };
        actions.appendChild(cancelBtn);
        actions.appendChild(saveBtn);
        row.appendChild(actions);

        amtInput.addEventListener('keydown', function(e){
          if (e.key === 'Enter') saveBtn.click();
        });
      } else {
        row.className = 'asset-row';
        row.innerHTML = '<div><span class="name">' + a.name + '</span><span class="amt">' + fmtWon(a.amount) + '</span></div>';

        var rowActions = document.createElement('div');
        rowActions.className = 'asset-row-actions';

        var editBtn = document.createElement('button');
        editBtn.className = 'edit';
        editBtn.textContent = '✎';
        editBtn.onclick = function(){
          editingAssetIndex = idx;
          render();
        };
        rowActions.appendChild(editBtn);

        var delBtn = document.createElement('button');
        delBtn.className = 'del';
        delBtn.textContent = '✕';
        delBtn.onclick = function(){
          state.assets.splice(idx, 1);
          if (editingAssetIndex === idx) editingAssetIndex = null;
          saveState();
          render();
        };
        rowActions.appendChild(delBtn);

        row.appendChild(rowActions);
      }

      assetListEl.appendChild(row);
    });
    if (!state.assets || state.assets.length === 0) {
      var anote = document.createElement('div');
      anote.className = 'empty-note';
      anote.textContent = '자산 항목을 추가해주세요 (예: 예금 500만원)';
      assetListEl.appendChild(anote);
    }
    assetTotalEl.textContent = fmtWon(getCurrentTotal());

    // today's expenses
    var todayDateStr = todayStr();
    expenseListEl.innerHTML = '';
    var todaysExpenses = [];
    (state.expenses || []).forEach(function(e, i){
      if (e.date === todayDateStr) todaysExpenses.push({ e: e, i: i });
    });
    if (todaysExpenses.length === 0) {
      var enote = document.createElement('div');
      enote.className = 'empty-note';
      enote.textContent = '오늘 지출 내역이 없어요';
      expenseListEl.appendChild(enote);
    } else {
      todaysExpenses.forEach(function(pair){
        var row = document.createElement('div');
        row.className = 'asset-row';
        row.innerHTML = '<div><span class="name">' + pair.e.name + '</span><span class="amt">' + fmtWon(pair.e.amount) + '</span></div>';
        var delBtn = document.createElement('button');
        delBtn.className = 'del';
        delBtn.textContent = '✕';
        delBtn.onclick = function(){
          state.expenses.splice(pair.i, 1);
          saveState();
          render();
        };
        row.appendChild(delBtn);
        expenseListEl.appendChild(row);
      });
    }
    var todayTotal = todaysExpenses.reduce(function(sum, pair){ return sum + pair.e.amount; }, 0);
    expenseTodayTotalEl.textContent = fmtWon(todayTotal);

    // this month's expense analysis
    var curMonth = todayDateStr.slice(0, 7);
    var monthExpenses = (state.expenses || []).filter(function(e){ return e.date && e.date.slice(0,7) === curMonth; });
    expenseAnalysisEl.innerHTML = '';
    if (monthExpenses.length === 0) {
      var mnote = document.createElement('div');
      mnote.className = 'empty-note';
      mnote.textContent = '이번 달 지출 내역이 아직 없어요';
      expenseAnalysisEl.appendChild(mnote);
    } else {
      var monthTotal = monthExpenses.reduce(function(sum, e){ return sum + e.amount; }, 0);

      var byItem = {};
      monthExpenses.forEach(function(e){
        byItem[e.name] = (byItem[e.name] || 0) + e.amount;
      });
      var items = Object.keys(byItem).map(function(name){
        return { name: name, amount: byItem[name] };
      }).sort(function(a,b){ return b.amount - a.amount; });

      var totalRow = document.createElement('div');
      totalRow.className = 'summary-row';
      totalRow.innerHTML = '<span class="label" style="font-weight:700; color:#e2e8f0;">이번 달 총 지출</span><span class="value" style="color:#f87171; font-size:15px;">' + fmtWon(monthTotal) + '</span>';
      totalRow.style.marginBottom = '10px';
      totalRow.style.paddingBottom = '10px';
      totalRow.style.borderBottom = '1px solid rgba(255,255,255,0.08)';
      expenseAnalysisEl.appendChild(totalRow);

      items.forEach(function(item, idx){
        var pct = monthTotal > 0 ? (item.amount / monthTotal * 100) : 0;
        var wrap = document.createElement('div');
        wrap.style.marginBottom = '12px';

        var line = document.createElement('div');
        line.style.display = 'flex';
        line.style.justifyContent = 'space-between';
        line.style.fontSize = '13px';
        line.style.marginBottom = '5px';
        line.innerHTML = '<span style="color:#e2e8f0; font-weight:' + (idx === 0 ? '700' : '500') + ';">' + (idx === 0 ? '🔥 ' : '') + item.name + '</span><span style="color:#94a3b8;">' + fmtWon(item.amount) + ' · ' + pct.toFixed(1) + '%</span>';
        wrap.appendChild(line);

        var bar = document.createElement('div');
        bar.className = 'stage-bar';
        var fill = document.createElement('div');
        fill.className = 'stage-bar-fill';
        fill.style.width = pct.toFixed(1) + '%';
        if (idx === 0) fill.style.background = 'linear-gradient(90deg, #f87171, #fbbf24)';
        bar.appendChild(fill);
        wrap.appendChild(bar);

        expenseAnalysisEl.appendChild(wrap);
      });
    }

    // goal chips
    goalChips.innerHTML = '';
    var sortedGoals = state.goals.slice().sort(function(a,b){ return a-b; });
    state.goals = sortedGoals;

    sortedGoals.forEach(function(g, idx){
      var chip = document.createElement('div');
      chip.className = 'goal-chip' + (selectedGoalForSim === g ? ' selected' : '');
      var labelSpan = document.createElement('span');
      labelSpan.className = 'chip-label';
      labelSpan.textContent = fmtWon(g);
      labelSpan.onclick = function(){
        selectedGoalForSim = (selectedGoalForSim === g) ? null : g;
        render();
      };
      chip.appendChild(labelSpan);
      var delBtn = document.createElement('button');
      delBtn.textContent = '✕';
      delBtn.onclick = function(){
        state.goals.splice(state.goals.indexOf(g), 1);
        if (selectedGoalForSim === g) selectedGoalForSim = null;
        saveState();
        render();
      };
      chip.appendChild(delBtn);
      goalChips.appendChild(chip);
    });

    if (sortedGoals.length === 0) {
      var note = document.createElement('div');
      note.className = 'empty-note';
      note.textContent = '목표금액을 추가해주세요';
      goalChips.appendChild(note);
    }

    // one-month simulation box: selected chip takes priority, otherwise reflect what's being typed
    monthSimBox.innerHTML = '';
    var typedGoalVal = (parseFloat(newGoalEl.value) || 0) * 10000;
    var effectiveSimGoal = (selectedGoalForSim !== null) ? selectedGoalForSim : ((typedGoalVal && typedGoalVal > 0) ? typedGoalVal : null);

    if (effectiveSimGoal !== null) {
      var simCurrent = getCurrentTotal();
      var need = effectiveSimGoal - simCurrent;
      var box = document.createElement('div');
      box.className = 'month-sim-box';

      var title = document.createElement('div');
      title.className = 'title';
      title.textContent = fmtWon(effectiveSimGoal) + ' · 한 달(30일) 안에 모으기';
      box.appendChild(title);

      if (need <= 0) {
        var doneRow = document.createElement('div');
        doneRow.className = 'row';
        doneRow.innerHTML = '<span>현재 보유 자산으로 이미 달성했어요</span>';
        box.appendChild(doneRow);
      } else {
        var row1 = document.createElement('div');
        row1.className = 'row';
        row1.innerHTML = '<span>현재 보유 자산</span><span class="val">' + fmtWon(simCurrent) + '</span>';
        box.appendChild(row1);

        var row2 = document.createElement('div');
        row2.className = 'row';
        row2.innerHTML = '<span>부족한 금액</span><span class="val">' + fmtWon(need) + '</span>';
        box.appendChild(row2);

        var needDaily = need / 30;
        var big = document.createElement('div');
        big.className = 'big';
        big.textContent = '하루 ' + fmtWon(needDaily) + '씩 저축';
        box.appendChild(big);
      }

      monthSimBox.appendChild(box);
    }

    // results
    var current = getCurrentTotal();
    var daily = parseFloat(dailyEl.value) || 0;
    var monthly = daily * 30;

    results.innerHTML = '';

    var displayGoals = sortedGoals.slice();
    var previewGoal = (typedGoalVal && typedGoalVal > 0 && sortedGoals.indexOf(typedGoalVal) === -1) ? typedGoalVal : null;
    if (previewGoal !== null) {
      displayGoals.push(previewGoal);
      displayGoals.sort(function(a,b){ return a-b; });
    }

    if (displayGoals.length === 0) {
      results.innerHTML = '<div class="empty-note">목표금액을 하나 이상 추가하면<br>시뮬레이션 결과가 표시됩니다</div>';
      return;
    }

    // current asset summary at the top of the results
    var assetSummary = document.createElement('div');
    assetSummary.style.marginBottom = '16px';
    assetSummary.style.paddingBottom = '14px';
    assetSummary.style.borderBottom = '1px solid rgba(255,255,255,0.08)';

    var assetTitleRow = document.createElement('div');
    assetTitleRow.style.fontSize = '13px';
    assetTitleRow.style.color = '#94a3b8';
    assetTitleRow.style.fontWeight = '600';
    assetTitleRow.style.marginBottom = '4px';
    assetTitleRow.textContent = '현재 보유 자산';
    assetSummary.appendChild(assetTitleRow);

    if (state.assets && state.assets.length) {
      state.assets.forEach(function(a){
        var aRow = document.createElement('div');
        aRow.className = 'summary-row';
        aRow.style.fontSize = '12px';
        aRow.innerHTML = '<span class="label">· ' + a.name + '</span><span class="value">' + fmtWon(a.amount) + '</span>';
        assetSummary.appendChild(aRow);
      });
    }

    var assetTotalRow = document.createElement('div');
    assetTotalRow.className = 'summary-row';
    assetTotalRow.style.borderTop = '1px solid rgba(255,255,255,0.08)';
    assetTotalRow.style.marginTop = '4px';
    assetTotalRow.style.paddingTop = '8px';
    assetTotalRow.innerHTML = '<span class="label" style="font-weight:700; color:#e2e8f0;">합계</span><span class="value" style="color:#38bdf8; font-size:15px;">' + fmtWon(current) + '</span>';
    assetSummary.appendChild(assetTotalRow);

    results.appendChild(assetSummary);

    var timeline = document.createElement('div');
    timeline.className = 'timeline';
    var today = new Date();
    var cumMonths = 0;
    var stageStart = current;

    displayGoals.forEach(function(goal){
      var stage = document.createElement('div');
      var done = current >= goal;
      var isPreview = (goal === previewGoal);
      stage.className = 'stage' + (done ? ' done' : '') + (isPreview ? ' stage-preview' : '');

      var goalLine = document.createElement('div');
      goalLine.className = 'stage-goal';
      goalLine.style.display = 'flex';
      goalLine.style.justifyContent = 'space-between';
      goalLine.style.alignItems = 'center';
      var goalLineText = document.createElement('span');
      goalLineText.textContent = '목표 ' + fmtWon(goal) + (isPreview ? ' (입력 중)' : '');
      goalLine.appendChild(goalLineText);
      if (!isPreview) {
        var stageDelBtn = document.createElement('button');
        stageDelBtn.textContent = '✕';
        stageDelBtn.style.background = 'none';
        stageDelBtn.style.border = 'none';
        stageDelBtn.style.color = '#f87171';
        stageDelBtn.style.fontSize = '14px';
        stageDelBtn.style.padding = '2px 4px';
        stageDelBtn.onclick = function(){
          state.goals.splice(state.goals.indexOf(goal), 1);
          if (selectedGoalForSim === goal) selectedGoalForSim = null;
          saveState();
          render();
        };
        goalLine.appendChild(stageDelBtn);
      }
      stage.appendChild(goalLine);

      var meta = document.createElement('div');
      meta.className = 'stage-meta';

      if (done) {
        meta.innerHTML = '<span class="highlight">이미 달성</span> (현재 자산 기준)';
      } else if (daily <= 0) {
        meta.innerHTML = '하루 저축액을 입력하면 도달 시점을 계산해드려요';
      } else {
        var m = monthsToReach(stageStart, goal, monthly);
        if (m === null) {
          meta.innerHTML = '현재 조건으로는 <span class="highlight">100년 내 도달 불가</span>';
        } else {
          cumMonths = Math.max(cumMonths, 0);
          var reachDate = addMonthsToDate(today, m);
          var years = Math.floor(m / 12);
          var rem = m % 12;
          var durText = (years > 0 ? years + '년 ' : '') + (rem > 0 || years === 0 ? rem + '개월' : '');
          meta.innerHTML = '<span class="highlight">' + durText + ' 후</span> (' + fmtDate(reachDate) + ') 도달 예상';
        }
      }
      stage.appendChild(meta);

      if (!done) {
        var progress = Math.min(100, Math.max(0, (current / goal) * 100));
        var bar = document.createElement('div');
        bar.className = 'stage-bar';
        var fill = document.createElement('div');
        fill.className = 'stage-bar-fill';
        fill.style.width = progress.toFixed(1) + '%';
        bar.appendChild(fill);
        stage.appendChild(bar);
      }

      timeline.appendChild(stage);
      stageStart = goal;
    });

    results.appendChild(timeline);

    // final summary
    var lastGoal = displayGoals[displayGoals.length - 1];
    if (daily > 0 && current < lastGoal) {
      var totalMonths = monthsToReach(current, lastGoal, monthly);
      if (totalMonths !== null) {
        var summary = document.createElement('div');
        summary.style.marginTop = '16px';
        summary.style.paddingTop = '14px';
        summary.style.borderTop = '1px solid rgba(255,255,255,0.08)';

        var row1 = document.createElement('div');
        row1.className = 'summary-row';
        row1.innerHTML = '<span class="label">최종 목표</span><span class="value">' + fmtWon(lastGoal) + '</span>';
        summary.appendChild(row1);

        var row2 = document.createElement('div');
        row2.className = 'summary-row';
        row2.innerHTML = '<span class="label">일 저축액</span><span class="value">' + fmtWon(daily) + '</span>';
        summary.appendChild(row2);

        var row2b = document.createElement('div');
        row2b.className = 'summary-row';
        row2b.innerHTML = '<span class="label">월 저축액 (환산)</span><span class="value">' + fmtWon(monthly) + '</span>';
        summary.appendChild(row2b);

        var row3 = document.createElement('div');
        row3.className = 'summary-row';
        row3.innerHTML = '<span class="label">총 소요기간</span><span class="value">' + Math.floor(totalMonths/12) + '년 ' + (totalMonths%12) + '개월</span>';
        summary.appendChild(row3);

        results.appendChild(summary);
      }
    }
  }

  addGoalBtn.addEventListener('click', function(){
    var v = (parseFloat(newGoalEl.value) || 0) * 10000;
    if (!v || v <= 0) return;
    if (state.goals.indexOf(v) === -1) {
      state.goals.push(v);
    }
    selectedGoalForSim = v;
    newGoalEl.value = '';
    saveState();
    render();
  });

  newGoalEl.addEventListener('keydown', function(e){
    if (e.key === 'Enter') addGoalBtn.click();
  });

  newGoalEl.addEventListener('input', function(){
    render();
  });

  addAssetBtn.addEventListener('click', function(){
    var name = (assetNameEl.value || '').trim();
    var amount = (parseFloat(assetAmountEl.value) || 0) * 10000;
    if (!name || !amount || amount <= 0) return;
    if (!state.assets) state.assets = [];
    state.assets.push({ name: name, amount: amount });
    assetNameEl.value = '';
    assetAmountEl.value = '';
    saveState();
    render();
  });

  assetAmountEl.addEventListener('keydown', function(e){
    if (e.key === 'Enter') addAssetBtn.click();
  });

  dailyEl.addEventListener('input', function(){
    saveState();
    render();
  });

  clearGoalsBtn.addEventListener('click', function(){
    if (!state.goals.length) return;
    if (!window.confirm('모든 목표금액을 삭제할까요?')) return;
    state.goals = [];
    selectedGoalForSim = null;
    saveState();
    render();
  });

  addDailyBtn.addEventListener('click', function(){
    var amt = parseFloat(dailyEl.value) || 0;
    if (amt <= 0) {
      addDailyMsg.textContent = '먼저 하루 저축 금액을 입력해주세요';
      return;
    }
    if (!state.assets) state.assets = [];
    var target = null;
    for (var i = 0; i < state.assets.length; i++) {
      if (state.assets[i].name === '목표통장') { target = state.assets[i]; break; }
    }
    if (target) {
      target.amount += amt;
    } else {
      state.assets.push({ name: '목표통장', amount: amt });
    }
    saveState();
    render();
    addDailyMsg.textContent = fmtWon(amt) + ' 추가됐어요!';
    setTimeout(function(){ addDailyMsg.textContent = ''; }, 2500);
  });

  addExpenseBtn.addEventListener('click', function(){
    var name = (expenseNameEl.value || '').trim();
    var amount = parseFloat(expenseAmountEl.value) || 0;
    if (!name || amount <= 0) return;
    if (!state.expenses) state.expenses = [];
    state.expenses.push({ name: name, amount: amount, date: todayStr() });
    expenseNameEl.value = '';
    expenseAmountEl.value = '';
    saveState();
    render();
  });

  expenseAmountEl.addEventListener('keydown', function(e){
    if (e.key === 'Enter') addExpenseBtn.click();
  });

  render();
})();
</script>
</body>
</html>
