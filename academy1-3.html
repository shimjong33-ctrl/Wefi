<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WeFi 4주 아카데미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --green-deep:#0A6B3D; --green:#149A5B; --green-bright:#2FCC8E;
  --green-glow:#E4FFF2;
  --gold:#C9A227; --gold-light:#E8D08A; --gold-deep:#8A6A1F;
  --mint:#E6F7EE; --mint-2:#F6FBF8; --cream:#FBFDFC;
  --ink:#0D1F17; --ink-soft:#5A6E64; --ink-faint:#8FA69B;
  --line:#DCEEE3; --line-soft:#EAF4EE; --gray-lock:#B7C4BC; --white:#FFFFFF;
  --shadow-sm: 0 2px 10px rgba(13,50,32,0.07);
  --shadow-md: 0 12px 30px rgba(13,50,32,0.11);
  --shadow-lg: 0 18px 44px rgba(13,50,32,0.18);
  --radius-lg:22px; --radius-md:17px; --radius-sm:13px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Pretendard','Noto Sans KR', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;background:var(--cream);color:var(--ink);-webkit-tap-highlight-color:transparent;letter-spacing:-0.1px;}
.wrap{max-width:480px;margin:0 auto;padding:0 0 64px 0;position:relative;background:var(--cream);}

/* Header */
.header{
  background:
    radial-gradient(circle at 88% -10%, rgba(255,255,255,0.16), transparent 45%),
    radial-gradient(circle at -8% 110%, rgba(255,255,255,0.12), transparent 40%),
    radial-gradient(circle at 50% 0%, rgba(201,162,39,0.14), transparent 55%),
    linear-gradient(155deg, var(--green-deep) 0%, var(--green) 62%, #1AAE68 100%);
  color:#fff;padding:30px 22px 36px 22px;border-radius:0 0 32px 32px;position:relative;overflow:hidden;
  box-shadow: var(--shadow-lg);
}
.header:before{content:"";position:absolute;right:-50px;top:-55px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,0.07);}
.header:after{content:"";position:absolute;left:-40px;bottom:-70px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,0.05);}
.brand{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700;letter-spacing:1.2px;opacity:0.9;position:relative;z-index:1;text-transform:uppercase;}
.brand-mark{width:24px;height:24px;border-radius:8px;background:#fff;color:var(--green-deep);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,0.18),0 0 0 1px rgba(201,162,39,0.35);}
.h-title{font-size:27px;font-weight:900;margin:16px 0 8px 0;line-height:1.3;position:relative;z-index:1;letter-spacing:-0.4px;}
.h-title:after{content:"";display:block;width:34px;height:2px;background:linear-gradient(90deg,var(--gold-light),var(--gold));margin-top:9px;border-radius:2px;}
.h-sub{font-size:12.5px;opacity:0.88;font-weight:500;position:relative;z-index:1;}

.progress-card{
  margin-top:22px;background:rgba(255,255,255,0.14);backdrop-filter:blur(8px);
  border:1px solid rgba(201,162,39,0.32);border-radius:18px;padding:16px 18px;position:relative;z-index:1;
  box-shadow: 0 4px 20px rgba(0,0,0,0.10);
}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;}
.progress-label{font-size:11.5px;font-weight:600;opacity:0.9;letter-spacing:0.3px;}
.progress-pct{font-size:21px;font-weight:900;letter-spacing:-0.3px;background:linear-gradient(90deg,#fff,var(--gold-light));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.progress-track{height:9px;background:rgba(255,255,255,0.22);border-radius:8px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold-light),#fff);border-radius:8px;transition:width .5s cubic-bezier(.4,0,.2,1);box-shadow:0 0 10px rgba(232,208,138,0.6);}

/* Homework section */
.hw-section{padding:22px 20px 4px 20px;}
.ext-link-section{padding:22px 20px 0 20px;}
.ext-link-card{display:flex;align-items:center;gap:13px;background:var(--white);border:1px solid var(--line-soft);border-radius:var(--radius-md);padding:14px 16px;box-shadow:var(--shadow-sm);text-decoration:none;}
.ext-link-icon{flex:none;width:38px;height:38px;border-radius:11px;background:linear-gradient(150deg,var(--green),var(--green-deep));color:#fff;font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(10,107,61,0.25);}
.ext-link-body{flex:1;min-width:0;}
.ext-link-title{font-size:13.5px;font-weight:800;color:var(--ink);}
.ext-link-sub{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.ext-link-arrow{flex:none;font-size:22px;color:var(--ink-faint);}
.goals-section{padding:22px 20px 4px 20px;}
.partner-section{padding:22px 20px 4px 20px;}
.partner-card{background:var(--white);border:1px solid var(--line-soft);border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-sm);}
.partner-title{font-size:15px;font-weight:900;color:var(--ink);margin-bottom:4px;padding-left:11px;border-left:3px solid var(--gold);}
.partner-sub{font-size:12px;color:var(--ink-soft);margin-bottom:12px;line-height:1.5;}
.partner-progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;}
.partner-progress-track{flex:1;height:9px;background:var(--line-soft);border-radius:6px;overflow:hidden;margin-right:10px;}
.partner-progress-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--green-deep));border-radius:6px;transition:width .4s ease;}
.partner-progress-label{font-size:12.5px;font-weight:900;color:var(--green-deep);flex:none;}
.partner-slot{border:1px solid var(--line-soft);border-radius:12px;padding:12px 13px;margin-bottom:10px;background:var(--cream);}
.partner-slot.done{background:var(--green-glow);border-color:var(--green-bright);}
.partner-slot-head{display:flex;align-items:center;gap:9px;margin-bottom:9px;}
.partner-slot-num{flex:none;width:26px;height:26px;border-radius:9px;background:var(--mint);color:var(--green-deep);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.partner-slot-num.done{background:var(--green);color:#fff;}
.partner-slot input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;font-family:inherit;margin-bottom:7px;}
.partner-status-row{display:flex;gap:5px;flex-wrap:wrap;}
.partner-status-btn{font-size:11px;font-weight:700;padding:6px 10px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);}
.partner-status-btn.active{background:var(--green-deep);color:#fff;border-color:var(--green-deep);}
.partner-reset-btn{color:#C0392B;border-color:#F2C4BC;background:#FDF1EF;}
.partner-celebrate{margin-top:4px;background:linear-gradient(135deg,var(--green-deep),var(--green));color:#fff;text-align:center;font-size:13px;font-weight:800;padding:14px;border-radius:12px;}
.goals-card{background:var(--white);border:1px solid var(--line-soft);border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-sm);}
.goals-title{font-size:15px;font-weight:900;color:var(--ink);margin-bottom:4px;padding-left:11px;border-left:3px solid var(--gold);}
.goals-sub{font-size:12px;color:var(--ink-soft);margin-bottom:13px;line-height:1.5;}
.goal-row{display:flex;align-items:center;gap:9px;margin-bottom:9px;}
.goal-row-wrap{margin-bottom:2px;}
.goal-num{flex:none;width:24px;height:24px;border-radius:8px;background:var(--mint);color:var(--green-deep);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.goal-input{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:12.5px;font-family:inherit;color:var(--ink);}
.goal-check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;}
.goal-check.on{background:var(--green);border-color:var(--green);box-shadow:0 2px 6px rgba(20,154,91,0.4);}
.goal-check.on svg{width:12px;height:12px;stroke:#fff;}
.goal-celebrate{font-size:11px;font-weight:800;color:var(--green-deep);margin:2px 0 9px 33px;animation:goalPop .3s ease;}
@keyframes goalPop{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
.goal-input:focus{outline:none;border-color:var(--green);}
.goals-progress{font-size:11px;color:var(--ink-faint);text-align:right;margin-top:2px;}
.hw-header{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.hw-title{font-size:17px;font-weight:900;color:var(--ink);letter-spacing:-0.3px;padding-left:11px;border-left:3px solid var(--gold);}
.hw-sub{font-size:12px;color:var(--ink-soft);margin-bottom:14px;}
.hw-card{background:var(--white);border:1px solid var(--line-soft);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:11px;display:flex;gap:13px;align-items:flex-start;box-shadow:var(--shadow-sm);transition:box-shadow .2s ease;}
.hw-card.done{background:var(--green-glow);border-color:var(--green-bright);}
.hw-num{flex:none;width:32px;height:32px;border-radius:11px;background:linear-gradient(150deg,var(--green),var(--green-deep));color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(10,107,61,0.25);}
.hw-body{flex:1;min-width:0;}
.hw-name{font-size:13.5px;font-weight:800;color:var(--ink);margin-bottom:4px;letter-spacing:-0.1px;}
.hw-desc{font-size:12px;color:var(--ink-soft);line-height:1.55;margin-bottom:8px;}
.hw-tag{font-size:10.5px;font-weight:700;color:var(--green-deep);background:var(--mint);border:1px solid var(--line);display:inline-block;padding:4px 9px;border-radius:20px;}
.hw-link{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--green),var(--green-deep));padding:7px 14px;border-radius:20px;text-decoration:none;box-shadow:0 3px 10px rgba(10,107,61,0.25);}
.hw-check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;margin-top:2px;cursor:pointer;transition:.15s;}
.hw-check.on{background:var(--green);border-color:var(--green);box-shadow:0 2px 6px rgba(20,154,91,0.4);}
.hw-check.on svg{width:12px;height:12px;stroke:#fff;}
.hw-banner{margin-top:4px;background:linear-gradient(135deg, var(--green-deep), var(--green));color:#fff;text-align:center;font-size:12.5px;font-weight:700;padding:13px;border-radius:var(--radius-md);box-shadow:var(--shadow-md);}

/* Timeline */
.timeline{padding:24px 20px 4px 20px;}
.certchallenge-section{padding:22px 20px 4px 20px;}
.certchallenge-card{background:linear-gradient(150deg,#101E14,#0B2A22);border:1px solid rgba(201,162,39,0.35);border-radius:var(--radius-lg);padding:20px 18px;box-shadow:var(--shadow-lg);color:#fff;}
.certchallenge-title{font-size:16px;font-weight:900;margin-bottom:4px;}
.certchallenge-sub{font-size:12px;color:rgba(255,255,255,0.75);margin-bottom:15px;line-height:1.5;}
.certchallenge-item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(201,162,39,0.3);border-radius:13px;padding:12px 13px;margin-bottom:9px;}
.certchallenge-badge{flex:none;width:42px;height:42px;border-radius:50%;background:linear-gradient(150deg,var(--gold-light),var(--gold-deep));display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 3px 10px rgba(201,162,39,0.35);}
.certchallenge-name{font-size:13.5px;font-weight:800;color:#fff;}
.certchallenge-name-en{font-size:10.5px;color:rgba(255,255,255,0.6);margin-top:1px;}
.certchallenge-dept{font-size:10px;font-weight:700;color:var(--gold-light);background:rgba(201,162,39,0.15);border:1px solid rgba(201,162,39,0.35);padding:2px 8px;border-radius:20px;display:inline-block;margin-top:5px;}
.certchallenge-apply{flex:none;font-size:11px;font-weight:800;color:#101E14;background:linear-gradient(135deg,var(--gold-light),var(--gold));padding:8px 12px;border-radius:20px;text-decoration:none;white-space:nowrap;}
.week[data-theme="2"]{--green:#0E8FA3;--green-deep:#075A68;--green-glow:#E2FBFF;--mint:#E1F6F9;--line-soft:#D9F0F3;}
.week[data-theme="3"]{--green:#C9922E;--green-deep:#8C6519;--green-glow:#FFF6E0;--mint:#FBF0D9;--line-soft:#F5E6C4;}
.week[data-theme="4"]{--green:#3A4A8F;--green-deep:#242F5C;--green-glow:#ECEEFA;--mint:#E4E7F7;--line-soft:#DCE0F3;}
.week{position:relative;padding-left:46px;margin-bottom:16px;}
.week-line{position:absolute;left:16px;top:38px;bottom:-16px;width:2px;background:linear-gradient(var(--line),var(--line-soft));}
.week:last-child .week-line{display:none;}
.week-node{position:absolute;left:0;top:0;width:34px;height:34px;border-radius:12px;background:var(--white);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;z-index:2;box-shadow:var(--shadow-sm);}
.week-node svg{width:16px;height:16px;color:var(--ink-faint);}
.week.done .week-node{background:linear-gradient(150deg,var(--green),var(--green-deep));border-color:var(--gold);box-shadow:0 4px 12px rgba(10,107,61,0.3),0 0 0 2px rgba(201,162,39,0.25);}
.week.done .week-node svg{stroke:#fff;fill:none;color:#fff;}
.week-card{background:var(--white);border:1px solid var(--line-soft);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);transition:box-shadow .2s ease;}
.week-card.open{box-shadow:var(--shadow-md);}
.week-head{padding:15px 17px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.week-tag{font-size:10.5px;font-weight:700;color:var(--green-deep);background:var(--mint);border:1px solid var(--line);padding:3px 9px;border-radius:20px;display:inline-block;margin-bottom:7px;}
.week-title{font-size:16px;font-weight:900;color:var(--ink);letter-spacing:-0.2px;}
.week-sub{font-size:12px;color:var(--ink-soft);margin-top:3px;}
.chevron{width:20px;height:20px;flex:none;transition:transform .25s ease;color:var(--ink-faint);}
.week-card.open .chevron{transform:rotate(180deg);}
.week-count{font-size:11px;color:var(--ink-faint);font-weight:600;margin-top:5px;}
.week-body{display:none;padding:2px 15px 17px 15px;}
.week-card.open .week-body{display:block;}
.topic{background:var(--cream);border:1px solid var(--line-soft);border-radius:var(--radius-sm);margin-bottom:9px;overflow:hidden;}
.topic-head{display:flex;align-items:center;gap:10px;padding:12px 13px;cursor:pointer;}
.chk{width:21px;height:21px;flex:none;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;background:#fff;transition:.15s;}
.chk.on{background:var(--green);border-color:var(--green);box-shadow:0 2px 6px rgba(20,154,91,0.35);}
.chk.on svg{width:11px;height:11px;stroke:#fff;}
.topic-name{font-size:13.5px;font-weight:700;flex:1;color:var(--ink);}
.topic-arrow{width:14px;height:14px;color:var(--ink-faint);transition:transform .2s;flex:none;}
.topic.open .topic-arrow{transform:rotate(90deg);}
.topic-content{display:none;padding:0 15px 15px 44px;font-size:13px;line-height:1.7;color:var(--ink-soft);white-space:pre-wrap;}
.topic.open .topic-content{display:block;}
.topic-content.empty{color:var(--gray-lock);font-style:italic;}
.admin-edit{width:100%;min-height:80px;margin-top:6px;border:1px dashed var(--green);border-radius:10px;padding:9px;font-size:13px;font-family:inherit;color:var(--ink);resize:vertical;}
.topic-img{width:100%;border-radius:12px;margin-bottom:11px;display:block;box-shadow:var(--shadow-sm);}
.admin-field-label{font-size:10.5px;color:var(--ink-soft);font-weight:700;display:block;margin:8px 0 3px 0;}
.admin-img-input{width:100%;padding:8px 9px;border:1px dashed var(--green);border-radius:10px;font-size:11.5px;font-family:inherit;margin-bottom:6px;}
.admin-name-edit{border:none;border-bottom:1px dashed var(--green);font-size:13.5px;font-weight:700;font-family:inherit;color:var(--ink);flex:1;background:transparent;padding:2px 0;min-width:0;}
.admin-del-topic{font-size:11px;color:#C0392B;border:1px solid #F2C4BC;background:#FDF1EF;border-radius:8px;padding:3px 7px;margin-left:6px;flex:none;}
.add-topic-btn{width:100%;padding:10px;border:1.5px dashed var(--green);border-radius:12px;background:#fff;color:var(--green-deep);font-size:12.5px;font-weight:700;margin-top:2px;}
.quiz-box{margin-top:14px;border-top:1px dashed var(--line);padding-top:16px;}
.quiz-title{font-size:13.5px;font-weight:800;color:var(--green-deep);margin-bottom:9px;}
.quiz-locked{background:var(--mint-2);border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:15px;text-align:center;color:var(--ink-faint);font-size:12.5px;font-weight:600;}
.quiz-btn{width:100%;padding:13px;border:1px solid rgba(201,162,39,0.4);border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--green),var(--green-deep));color:#fff;font-size:13.5px;font-weight:800;box-shadow:0 6px 16px rgba(10,107,61,0.22);letter-spacing:0.2px;}
.qcard{background:#fff;border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:15px;margin-bottom:11px;box-shadow:var(--shadow-sm);}
.qcard .qtext{font-size:13px;font-weight:700;margin-bottom:11px;}
.qopt{display:flex;align-items:center;gap:8px;padding:10px 11px;border:1px solid var(--line-soft);border-radius:11px;margin-bottom:7px;font-size:12.5px;transition:.15s;}
.qopt input{accent-color:var(--green);}
.qopt.correct{border-color:var(--green);background:var(--green-glow);}
.qopt.wrong{border-color:#E0A69C;background:#FDF1EF;}
.quiz-result{text-align:center;padding:15px;border-radius:var(--radius-sm);background:var(--mint);font-weight:800;font-size:15px;color:var(--green-deep);margin-top:6px;}
.quiz-admin-form{background:#fff;border:1px dashed var(--green);border-radius:var(--radius-sm);padding:13px;margin-top:11px;}
.quiz-admin-form input[type=text]{width:100%;padding:9px;margin-bottom:6px;border:1px solid var(--line);border-radius:10px;font-size:12.5px;font-family:inherit;}
.quiz-admin-form label{font-size:11px;color:var(--ink-soft);display:block;margin:4px 0 2px 0;}
.quiz-add-btn{width:100%;padding:10px;border:none;border-radius:10px;background:var(--green-deep);color:#fff;font-size:12.5px;font-weight:700;margin-top:4px;}
.quiz-del{font-size:11px;color:#C0392B;float:right;border:none;background:none;font-weight:700;}

.cert{margin:22px 20px 0 20px;padding:26px 22px;border-radius:22px;background:
  radial-gradient(circle at 15% 20%, rgba(255,255,255,0.14), transparent 40%),
  radial-gradient(circle at 85% 85%, rgba(255,255,255,0.10), transparent 45%),
  linear-gradient(150deg, var(--green-deep), var(--green));
  color:#fff;text-align:center;display:none;box-shadow:var(--shadow-lg);}
.cert.show{display:block;}
.cert-trophy{font-size:38px;margin-bottom:9px;}
.cert-title{font-size:17px;font-weight:900;margin-bottom:5px;letter-spacing:-0.2px;}
.cert-sub{font-size:12.5px;opacity:0.92;}

.admin-bar{max-width:480px;margin:20px auto 0 auto;padding:0 20px;display:flex;justify-content:center;}
.admin-toggle{font-size:11.5px;color:var(--ink-soft);background:#fff;border:1px solid var(--line);padding:7px 16px;border-radius:20px;font-weight:600;box-shadow:var(--shadow-sm);letter-spacing:0.3px;}
.admin-toggle.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.admin-banner{max-width:480px;margin:11px auto 0 auto;padding:8px 20px;text-align:center;font-size:11.5px;color:var(--green-deep);font-weight:700;display:none;}
.admin-banner.show{display:block;}
.app-footer{max-width:480px;margin:26px auto 0 auto;padding:18px 20px 8px 20px;text-align:center;}
.app-footer-name{font-size:11.5px;font-weight:800;color:var(--ink-soft);}
.app-footer-role{font-size:10.5px;color:var(--ink-faint);margin-top:2px;}
.mail-section{padding:6px 20px 4px 20px;}
.mail-card{background:var(--white);border:1px solid var(--line-soft);border-radius:var(--radius-md);padding:15px 16px;box-shadow:var(--shadow-sm);}

.mail-empty{font-size:12px;color:var(--ink-faint);text-align:center;padding:14px;}

.session-text{font-size:12.5px;font-weight:700;color:var(--ink);}

.session-edit-title{font-size:12.5px;font-weight:800;color:var(--green-deep);margin-bottom:8px;}

.glossary-chevron{width:18px;height:18px;color:var(--ink-faint);transition:transform .2s;}
.glossary-chevron.open{transform:rotate(180deg);}

 쓸 수 있는 돈에서, 내가 '언제든 직접' 확인하고 쓸 수 있는 돈으로 바뀌는 것, 그게 디오뱅크가 만드는 변화예요.\n\n💬 생각해보기\n- 최근 은행 때문에 불편함을 느꼈던 경험이 있나요?\n- 그 상황이 디오뱅크였다면 어떻게 달라졌을까요?"},
      {id:"w1t2", name:"디오뱅크란 무엇인가", content:"🎯 학습목표: '디오뱅크'라는 새로운 개념의 정의와 구조를 정확히 설명할 수 있다.\n\n디오뱅크(DeoBank)는 '탈중앙화(Decentralized) + 은행(Bank)'을 합친 말입니다. WeFi가 만든 신조어이자, 앞으로의 금융 서비스를 설명하는 핵심 키워드입니다.\n\n📌 기존 은행과 디오뱅크, 무엇이 다를까요?\n\n[누가 내 돈을 보관하나요?]\n기존 은행: 은행이 내 돈을 대신 보관하고 관리해요. 은행에 문제가 생기면 내 돈도 영향을 받을 수 있어요.\n디오뱅크: 블록체인 위에서 내 자산은 나의 소유로 기록돼요. 사용자가 통제권을 유지해요.\n\n[어떻게 쓸 수 있나요?]\n기존 은행과 디오뱅크 둘 다 카드결제, 송금, 저축 같은 기능을 제공해요. 사용성은 비슷하게 느껴지도록 설계돼 있어요.\n\n[기록은 어디에 남나요?]\n기존 은행: 은행 내부 서버에만 기록이 남아요. 외부에서 확인할 수 없어요.\n디오뱅크: 블록체인(WeChain) 위에 기록이 남아서, 누구나 검증할 수 있어요.\n\n📌 비유로 이해하기\n기존 은행이 '금고를 가진 관리인'이라면, 디오뱅크는 '내가 직접 열쇠를 쥐고 있는 투명한 금고'라고 생각하면 쉬워요. 관리인에게 맡기지 않아도, 필요할 때 카드처럼 바로 꺼내 쓸 수 있는 구조예요.\n\nWeFi는 이 개념을 D1 App(뱅킹 앱), Visa 카드, 듀얼 밸런스 계좌로 실제 서비스화하고 있으며, 2주차에서 각각을 자세히 다룹니다.\n\n💬 생각해보기\n- '내 돈의 열쇠를 내가 쥔다'는 표현을 신규 회원에게 어떻게 쉽게 설명할 수 있을까요?"},
      {id:"w1t4", name:"블록체인, 아주 쉽게 이해하기", content:"🎯 학습목표: 블록체인이 무엇인지, 왜 신뢰할 수 있는지 비유를 통해 이해한다.\n\n📌 블록체인 = '모두가 함께 쓰는 공동 장부'\n\n동네 계모임을 떠올려보세요. 한 사람이 장부를 몰래 들고 있으면, 그 사람이 숫자를 바꿔도 아무도 알 수 없어요. 그런데 계모임 사람 모두가 각자 똑같은 장부 사본을 갖고 있고, 거래가 생길 때마다 다 같이 확인하고 기록한다면 어떨까요? 한 사람이 몰래 숫자를 바꾸는 게 사실상 불가능해져요.\n\n블록체인이 바로 이 '모두가 함께 쓰는 장부' 구조예요.\n\n📌 핵심 특징 3가지\n1. 분산 저장 — 하나의 회사나 서버가 아니라, 여러 참여자(노드)가 같은 기록을 나눠 가져요.\n2. 공동 검증 — 새로운 거래가 생기면 여러 참여자가 함께 확인한 뒤에만 장부에 추가돼요.\n3. 변경 불가 — 한번 기록되면 임의로 되돌리거나 조작하기 매우 어려워요.\n\n📌 그래서 왜 중요한가요?\n은행처럼 '한 곳을 100% 믿어야 하는 구조'가 아니라, '여러 곳이 서로 검증하기 때문에 믿을 수 있는 구조'로 바뀌는 거예요. WeFi의 자체 메인넷인 WeChain도 이 원리로 작동합니다. (2주차에서 자세히 다뤄요.)\n\n💬 생각해보기\n- 계모임 비유를 신규 회원에게 설명한다면 어떤 예시로 바꿔서 말해보고 싶나요?"},
      {id:"w1t3", name:"WeFi가 그리는 미래", content:"🎯 학습목표: WeFi의 비전과 핵심 팀을 이해하고, 왜 지금 이 흐름에 주목해야 하는지 설명할 수 있다.\n\nWeFi의 목표는 단순합니다. '누구나, 어디서나, 은행 없이 은행처럼 쓸 수 있는 금융'을 만드는 것.\n\n📌 WeFi를 이끄는 사람들\n- Reeve Collins (Chairman) — Tether(USDT) 공동창업자. 스테이블코인 산업 초창기부터 참여한 인물로, WeFi 비전에 신뢰를 더하는 배경이 됩니다.\n- Maksym Sakharov (CEO) — 전체 사업을 총괄합니다.\n- Michael Batuev — 결제(Payments) 부문을 이끕니다.\n- Roman Rossov (CPO) — 제품(Product) 전체를 설계합니다.\n\n📌 WeFi가 갖춘 4가지 조각\n1. WeChain — 자체 블록체인 메인넷 (기록의 기반)\n2. D1 App — 사용자가 실제로 쓰는 뱅킹 앱 (사용의 창구)\n3. Visa 카드 — 실생활 결제 연결 (사용의 확장)\n4. Energy 시스템 — 생태계 참여에 대한 보상 (성장의 동력)\n\n이 네 조각이 하나로 연결되어야 '진짜 쓸 수 있는 디오뱅크'가 완성돼요. 이번 4주 과정은 이 조각들을 하나씩 이해하고(1~2주차), 실제로 써보고(3주차), 사업으로 확장하는(4주차) 순서로 설계되어 있습니다.\n\n💬 생각해보기\n- 이 네 조각 중 신규 회원에게 가장 먼저 소개하고 싶은 것은 무엇인가요? 그 이유는?"},

function totalTopics(){
  var t=0; for(var i=0;i<data.length;i++){ t += data[i].topics.length; } return t;
}
function doneTopics(){
  var d=0;
  for(var i=0;i<data.length;i++){
    var w=data[i];
    for(var j=0;j<w.topics.length;j++){
      if(progress.done[w.topics[j].id]) d++;
    }
  }
  return d;
}
function weekDoneCount(week){
  var d=0;
  for(var j=0;j<week.topics.length;j++){ if(progress.done[week.topics[j].id]) d++; }
  return d;
}
function weekComplete(week){
  return week.topics.length>0 && weekDoneCount(week)===week.topics.length;
}
function getMainQuiz(week){
  if(!week.quiz) return [];
  if(Array.isArray(week.quiz)) return week.quiz;
  return week.quiz.main || [];
}
function getRetryQuiz(week){
  if(!week.quiz || Array.isArray(week.quiz)) return [];
  return week.quiz.retry || [];
}
function ensureQuizObject(week){
  if(!week.quiz || Array.isArray(week.quiz)){
    var oldArr = week.quiz || [];
    week.quiz = {main:oldArr, retry:[]};
  }
  return week.quiz;
}
function esc(s){
  if(!s) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

var DAY_NAMES = ["일","월","화","수","목","금","토"];

function computeNextSession(){
  var now = new Date();
  var dow = now.getDay();
  var targetMinutes = sessionConfig.hour*60 + sessionConfig.minute;
  var nowMinutes = now.getHours()*60 + now.getMinutes();
  var diffDays = (sessionConfig.day - dow + 7) % 7;
  if(diffDays===0 && nowMinutes >= targetMinutes){
    diffDays = 7;
  }
  return diffDays;
}

function pad2(n){ return n<10 ? "0"+n : ""+n; }

function renderQuiz(week){
  var complete = weekComplete(week);
  var mainQ = getMainQuiz(week);
  var retryQ = getRetryQuiz(week);
  var hasMain = mainQ.length>0;
  var stage = quizStage[week.id] || 'main';
  var mode = quizMode[week.id];
  var activeSet = (stage==='retry') ? retryQ : mainQ;
  var s = '<div class="quiz-box">';
  s += '<div class="quiz-title">' + esc(week.tag) + ' 퀴즈</div>';

  if(!hasMain && !isAdmin){
    s += '<div class="quiz-locked">아직 등록된 퀴즈가 없습니다</div>';
  } else if(!complete && !isAdmin){
    s += '<div class="quiz-locked">모든 항목을 완료하면 퀴즈가 열립니다</div>';
  } else if(hasMain && (mode==='taking' || mode==='result')){
    s += renderQuizQuestions(week, mode, stage, activeSet);
  } else if(hasMain){
    s += '<button class="quiz-btn" data-action="start-quiz" data-stage="main" data-week="' + week.id + '">퀴즈 풀기 (' + mainQ.length + '문제)</button>';
  }

  if(isAdmin){
    s += renderQuizAdmin(week);
  }
  s += '</div>';
  return s;
}

function renderQuizQuestions(week, mode, stage, activeSet){
  var s = "";
  var answers = quizAnswers[week.id] || {};
  var label = (stage==='retry') ? ('재도전 퀴즈 (' + activeSet.length + '문제)') : ('기본 퀴즈 (' + activeSet.length + '문제)');
  s += '<div style="font-size:11.5px;color:var(--green-deep);font-weight:700;margin-bottom:8px;">' + label + '</div>';
  for(var qi=0; qi<activeSet.length; qi++){
    var q = activeSet[qi];
    s += '<div class="qcard"><div class="qtext">' + (qi+1) + '. ' + esc(q.q) + '</div>';
    for(var oi=0; oi<q.options.length; oi++){
      var cls = "qopt";
      if(mode==='result'){
        if(oi===q.correct) cls += " correct";
        else if(answers[qi]===oi) cls += " wrong";
      }
      s += '<label class="' + cls + '">';
      s += '<input type="radio" name="q_' + week.id + '_' + qi + '" ' + (answers[qi]===oi?'checked':'') + (mode==='result'?' disabled':'') + ' data-action="answer-quiz" data-week="' + week.id + '" data-q="' + qi + '" data-opt="' + oi + '">';
      s += esc(q.options[oi]) + '</label>';
    }
    s += '</div>';
  }
  if(mode==='taking'){
    s += '<button class="quiz-btn" data-action="submit-quiz" data-week="' + week.id + '">채점하기</button>';
  } else {
    var score = 0;
    for(var i=0;i<activeSet.length;i++){ if(answers[i]===activeSet[i].correct) score++; }
    s += '<div class="quiz-result">' + score + ' / ' + activeSet.length + '점</div>';
    if(stage==='main'){
      if(score===activeSet.length){
        s += '<div style="text-align:center;font-size:12.5px;color:var(--green-deep);font-weight:700;margin-top:6px;">전부 맞혔어요! 통과입니다 🎉</div>';
        s += '<button class="quiz-btn" style="margin-top:8px;" data-action="start-quiz" data-stage="main" data-week="' + week.id + '">다시 풀기</button>';
      } else {
        var retryLen = getRetryQuiz(week).length;
        if(retryLen>0){
          s += '<div style="text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:6px;">1문제 이상 틀렸어요. 복습을 위한 재도전 퀴즈로 다시 확인해봐요.</div>';
          s += '<button class="quiz-btn" style="margin-top:8px;" data-action="start-quiz" data-stage="retry" data-week="' + week.id + '">재도전 퀴즈 풀기 (' + retryLen + '문제)</button>';
        } else {
          s += '<button class="quiz-btn" style="margin-top:8px;" data-action="start-quiz" data-stage="main" data-week="' + week.id + '">다시 풀기</button>';
        }
      }
    } else {
      s += '<button class="quiz-btn" style="margin-top:8px;" data-action="start-quiz" data-stage="main" data-week="' + week.id + '">처음부터 다시 풀기</button>';
    }
  }
  return s;
}

      var qIdx = parseInt(el.getAttribute("data-q"),10);
      wk3.quiz[setName].splice(qIdx,1);

      render();
    } else if(action==="open-add-quiz"){
      var setName2 = el.getAttribute("data-set") || "main";
      quizAdd[weekId + "_" + setName2] = true;
      render();
    } else if(action==="add-quiz"){
      var setName3 = el.getAttribute("data-set") || "main";
      var prefix = "newq_" + setName3 + "_" + weekId + "_";
      var qText = document.getElementById(prefix+"q").value.replace(/^\s+|\s+$/g,"");
      var o0 = document.getElementById(prefix+"o0").value.replace(/^\s+|\s+$/g,"");
      var o1 = document.getElementById(prefix+"o1").value.replace(/^\s+|\s+$/g,"");
      var o2 = document.getElementById(prefix+"o2").value.replace(/^\s+|\s+$/g,"");
      var o3 = document.getElementById(prefix+"o3").value.replace(/^\s+|\s+$/g,"");
      var cRaw = document.getElementById(prefix+"c").value.replace(/^\s+|\s+$/g,"");
      var correctIdx = parseInt(cRaw,10) - 1;
      if(!qText || !o0 || !o1 || isNaN(correctIdx)){
        alert("질문, 보기 1~2, 정답 번호는 필수입니다.");
        return;
      }
      var opts = [o0,o1]; if(o2) opts.push(o2); if(o3) opts.push(o3);
      if(correctIdx<0 || correctIdx>=opts.length){
        alert("정답 번호가 보기 범위를 벗어났습니다.");
        return;
      }
      var wk4 = findWeek(weekId);
      ensureQuizObject(wk4);
      wk4.quiz[setName3].push({q:qText, options:opts, correct:correctIdx});
      saveData();
      quizAdd[weekId + "_" + setName3] = false;
      render();
    }
  };

  container.onchange = function(e){

function syncToSheets(){
  if(!sheetsUrl){ alert("먼저 관리자 모드에서 구글시트 연동 URL을 등록해주세요."); return; }
  syncing = true;
  syncStatus = "";
  render();
  var totalT = totalTopics();
  var doneT = doneTopics();
  var pct = totalT>0 ? Math.round((doneT/totalT)*100) : 0;
  var weekSummary = data.map(function(w){
    return { week: w.tag, done: weekDoneCount(w), total: w.topics.length };
  });
  var goalsFilled = goals.filter(function(g){ return g; }).length;
  var payload = {
    name: userName || "(이름 미입력)",
    timestamp: new Date().toISOString(),
    overallPct: pct,
    weeks: weekSummary,
    goalsFilled: goalsFilled
  };
  fetch(sheetsUrl, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(payload)
  })
  .then(function(){
    syncing = false;
    syncStatus = "✅ " + nowStr() + " 전송 완료";
    render();
  })
  .catch(function(e){
    syncing = false;
    syncStatus = "❌ 전송 실패: " + e.message;
    render();
  });
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawCornerBracket(ctx,x,y,dx,dy,size){
  ctx.beginPath();
  ctx.moveTo(x, y+dy*size);
  ctx.lineTo(x, y);
  ctx.lineTo(x+dx*size, y);
  ctx.stroke();
}

function drawLaurel(ctx,cx,cy,dir){
  // dir: -1 = leaves point left (wreath on left side), 1 = right side
  ctx.save();
  ctx.strokeStyle = "#C6A15B";
  ctx.fillStyle = "#C6A15B";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.quadraticCurveTo(cx + dir*46, cy-14, cx + dir*70, cy-2);
  ctx.stroke();
  for(var i=0;i<5;i++){
    var t = i/4;
    var lx = cx + dir*(18 + t*48);
    var ly = cy - 6 - t*8;
    ctx.save();
    ctx.translate(lx, ly);
    ctx.rotate(dir* (0.5 - t*0.35));
    ctx.beginPath();
    ctx.ellipse(0,0,9,4,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawMedal(ctx,cx,cy){
  ctx.save();
  // ribbon tails
  ctx.fillStyle = "#0F3B31";
  ctx.beginPath();
  ctx.moveTo(cx-34, cy+18);
  ctx.lineTo(cx-8, cy+18);
  ctx.lineTo(cx-8, cy+140);
  ctx.lineTo(cx-34, cy+110);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx+34, cy+18);
  ctx.lineTo(cx+8, cy+18);
  ctx.lineTo(cx+8, cy+140);
  ctx.lineTo(cx+34, cy+110);
  ctx.closePath();
  ctx.fill();
  // outer circle
  var grad = ctx.createLinearGradient(cx-60,cy-60,cx+60,cy+60);
  grad.addColorStop(0,"#F3D48A");
  grad.addColorStop(0.5,"#C99A45");
  grad.addColorStop(1,"#8A6A2C");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx,cy,62,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle = "#0B2A22";
  ctx.beginPath();
  ctx.arc(cx,cy,50,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = "#D8B76A";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx,cy,50,0,Math.PI*2);
  ctx.stroke();
  ctx.fillStyle = "#F3D48A";
  ctx.textAlign = "center";
  ctx.font = "bold 15px sans-serif";
  ctx.fillText("★ ★ ★ ★ ★", cx, cy-22);
  ctx.font = "bold 22px sans-serif";
  ctx.fillText("W", cx, cy+4);
  ctx.font = "bold 13px sans-serif";
  ctx.fillText("WeFi", cx, cy+22);
  ctx.restore();
}

function drawFooterIcon(ctx,cx,cy,label,sub){
  ctx.save();
  ctx.strokeStyle = "#4FBF9A";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx,cy,26,0,Math.PI*2);
  ctx.stroke();
  ctx.fillStyle = "#4FBF9A";
  ctx.textAlign = "center";
  ctx.font = "bold 18px sans-serif";
  ctx.fillText("W", cx, cy+7);
  ctx.fillStyle = "#F2F5F3";
  ctx.font = "bold 15px sans-serif";
  ctx.fillText(label, cx, cy+52);
  ctx.fillStyle = "rgba(230,240,235,0.6)";
  ctx.font = "12px sans-serif";
  ctx.fillText(sub, cx, cy+72);
  ctx.restore();
}

function connectGmail(){
  if(!gmailClientId){ alert("먼저 관리자 모드에서 Gmail Client ID를 설정해주세요."); return; }
  if(!window.google || !window.google.accounts || !window.google.accounts.oauth2){
    alert("Google 로그인 준비 중이에요. 잠시 후 다시 시도해주세요.");
    return;
  }
  var tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: gmailClientId,
    scope: "https://www.googleapis.com/auth/gmail.readonly",
    callback: function(resp){
      if(resp.error){ alert("로그인에 실패했어요: " + resp.error); return; }
      gmailAccessToken = resp.access_token;
      fetchGmailDeposits();
    }
  });
  tokenClient.requestAccessToken();
}

function fetchGmailDeposits(){
  if(!gmailAccessToken) return;
  gmailLoading = true;
  render();
  var q = encodeURIComponent("(from:binance OR subject:입금 OR subject:Deposit OR subject:deposit) newer_than:30d");
  fetch("https://www.googleapis.com/gmail/v1/users/me/messages?maxResults=15&q=" + q, {
    headers: { Authorization: "Bearer " + gmailAccessToken }
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    var msgs = data.messages || [];
    var ids = [];
    for(var i=0;i<msgs.length;i++){ ids.push(msgs[i].id); }
    return Promise.all(ids.map(function(id){
      return fetch("https://www.googleapis.com/gmail/v1/users/me/messages/" + id + "?format=metadata&metadataHeaders=Subject&metadataHeaders=Date&metadataHeaders=From", {
        headers: { Authorization: "Bearer " + gmailAccessToken }
      }).then(function(r2){ return r2.json(); });
    }));
  })
  .then(function(fullMsgs){
    gmailMessages = fullMsgs.map(function(m){
      var headers = (m.payload && m.payload.headers) || [];
      function getH(name){
        for(var i=0;i<headers.length;i++){ if(headers[i].name===name) return headers[i].value; }
        return "";
      }
      return { id:m.id, subject:getH("Subject"), from:getH("From"), date:getH("Date"), snippet:m.snippet || "" };
    });
    gmailLoading = false;
    render();
  })
  .catch(function(e){
    gmailLoading = false;
    render();
    alert("메일을 불러오지 못했어요: " + e.message);
  });
}


function findWeek(weekId){
  for(var i=0;i<data.length;i++){ if(data[i].id===weekId) return data[i]; }
  return null;
}
